name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "easyuv-lint $GITHUB_REF_NAME" --notes-file notes.md --verify-tag || true

  build:
    needs: create
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="easyuv-lint-${{ matrix.target }}.${{ matrix.ext }}"
          cd "target/${{ matrix.target }}/release"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$GITHUB_WORKSPACE/$name" easyuv-lint.exe >/dev/null
          else
            tar -czf "$GITHUB_WORKSPACE/$name" easyuv-lint
          fi
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$name" > "$name.sha256" 2>/dev/null || sha256sum "$name" > "$name.sha256"
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" easyuv-lint-${{ matrix.target }}.* --clobber

  desktop:
    name: Desktop installer (Windows)
    needs: create
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build the installer
        working-directory: desktop/src-tauri
        run: cargo tauri build
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          setup=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$setup" EasyUV-Lint-Setup-x64.exe
          sha256sum EasyUV-Lint-Setup-x64.exe > EasyUV-Lint-Setup-x64.exe.sha256
          gh release upload "$GITHUB_REF_NAME" EasyUV-Lint-Setup-x64.exe EasyUV-Lint-Setup-x64.exe.sha256 --clobber
