[package]
name = "easyuv-lint"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Lint 3D assets in CI: UV overlaps, flipped faces, texel density, polycount, scale. Powered by the EasyUV engine."
repository = "https://github.com/lburdier/easyuv-lint"
readme = "README.md"
keywords = ["3d", "uv", "lint", "gamedev", "gltf"]
categories = ["command-line-utilities", "game-development", "graphics"]

[lib]
name = "easyuv_lint"
path = "src/lib.rs"

[[bin]]
name = "easyuv-lint"
path = "src/main.rs"

[dependencies]
easyuv-core = { git = "https://github.com/lburdier/EasyUV", tag = "v0.3.9" }
gltf = "1.4"
ufbx = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[workspace]
members = [".", "desktop/src-tauri"]
default-members = ["."]
