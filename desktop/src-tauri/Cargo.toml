[package]
name = "easyuv-lint-desktop"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "EasyUV Lint Desktop: check 3D assets with a graphical interface"
publish = false

[[bin]]
name = "easyuv-lint-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
easyuv-lint = { path = "../.." }
tauri = { version = "2", features = [] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
